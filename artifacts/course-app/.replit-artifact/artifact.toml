kind = "web"
previewPath = "/"
title = "Course App"
description = "A course platform for learners and instructors to discover courses, manage course content, and collaborate through group chat, with Supabase as its backend."
version = "1.0.0"
id = "artifacts/course-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20216

[services.development]
run = "pnpm --filter @workspace/course-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/course-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/course-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20216"
BASE_PATH = "/"
